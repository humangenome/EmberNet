name: Bug report
description: Something in the EmberNet app or its mods is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bugs in EmberNet. For your host's control panel, billing or support, contact your host.

        If a **server** won't start, doesn't save the world or doesn't show in the server list, report it on [EmberNetServer](https://github.com/HumanGenome/EmberNetServer/issues) instead.

  - type: input
    id: embernet-version
    attributes:
      label: EmberNet version
      placeholder: "e.g. v0.2.1, and which download you installed"
    validations:
      required: true

  - type: input
    id: game-build
    attributes:
      label: Emberville build (Steam build ID if known)
      placeholder: "e.g. build 1234567"

  - type: input
    id: os
    attributes:
      label: Your Windows version
      placeholder: "e.g. Windows 11 Pro 24H2"

  - type: dropdown
    id: server-kind
    attributes:
      label: What kind of server were you connecting to?
      options:
        - A server I host myself
        - A rented server
        - A friend's server
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Be specific. Exact clicks, the address you entered, and anything you changed beforehand.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste or attach the lines from the app's log. Settings > Open log folder opens it.
      render: text

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I've searched existing issues for a duplicate
          required: true
        - label: This is an EmberNet bug, not a hosting-provider support request
          required: true
